name: Alertas DevOps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  alerta:
    runs-on: ubuntu-latest

    steps:
      - name: Simular execução
        run: |
          echo "Workflow de alertas executado com sucesso"

      - name: Verificar resultado
        if: failure()
        run: |
          echo "ALERTA: O workflow apresentou uma falha."
