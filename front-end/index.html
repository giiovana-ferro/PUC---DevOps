<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestão de Usuários - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🔐
        </div>

        <h1>Gestão de Usuários</h1>

        <p class="subtitle">
            API REST Segura
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                >

            </div>

            <div class="form-group">

                <label for="senha">
                    Senha
                </label>

                <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                >

            </div>

            <button
                    type="submit"
                    class="btn btn-primary btn-full"
            >
                Acessar
            </button>

        </form>

        <div id="mensagem"></div>

        <div class="login-info">

            <p><strong>Usuários para teste:</strong></p>

            <p>Admin: admin@email.com</p>
            <p>Operador: operador@email.com</p>
            <p>Cliente: cliente@email.com</p>

            <p>Senha: 123456</p>

        </div>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
